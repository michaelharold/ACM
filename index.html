<!doctype html>
<!-- `dark` is set here, not by JS, so there is no light flash before React mounts. -->
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/acm-logo-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/acm-logo-512.png" />
    <link rel="apple-touch-icon" href="/acm-logo-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ACM TKMCE — Official website & event management portal of the ACM Student Chapter at TKM College of Engineering."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ACM TKMCE — Student Chapter</title>
    <!--
      Intro loader. Lives here (not in React) so it paints the instant the page
      arrives, before the app bundle downloads. Just the chapter logo on deep
      black with a thin glow; the only light in the room is that glow spilling
      onto the background, and it brightens as the site actually loads — the
      app reports when it mounts (__acmStep) and when its data is in
      (__acmLoaded). Then the logo eases forward and the page is revealed.
    -->
    <style>
      #acm-loader {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: #000; color: #737373; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 800ms cubic-bezier(0.32, 0.72, 0, 1) 150ms;
      }
      /* The glow's reflection on the black: a soft pool of brand-blue light. */
      #acm-loader .spill {
        position: absolute; left: 50%; top: 50%; width: min(120vw, 900px); aspect-ratio: 1;
        transform: translate(-50%, -50%) scale(calc(0.7 + 0.3 * var(--p, 0)));
        background: radial-gradient(closest-side, rgba(63, 107, 255, 0.16), rgba(31, 71, 245, 0.06) 45%, transparent 72%);
        opacity: calc(0.35 + 0.65 * var(--p, 0)); pointer-events: none;
        transition: opacity 600ms ease, transform 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #acm-loader .stage { position: relative; display: flex; flex-direction: column; align-items: center; }
      #acm-loader .mark {
        width: clamp(96px, 26vw, 132px); height: auto;
        opacity: 0; transform: scale(0.92); filter: blur(8px);
        transition: opacity 900ms ease, transform 1100ms cubic-bezier(0.22, 1, 0.36, 1), filter 1100ms ease;
      }
      /* A thin halo that grows a little with the progress. */
      #acm-loader.ready .mark {
        opacity: 1; transform: scale(1);
        filter: drop-shadow(0 0 1.5px rgba(143, 176, 255, 0.9))
                drop-shadow(0 0 calc(10px + 14px * var(--p, 0)) rgba(63, 107, 255, calc(0.35 + 0.35 * var(--p, 0))));
      }
      #acm-loader .count {
        margin-top: clamp(28px, 6vw, 40px); font-size: 11px; font-weight: 500; line-height: 1;
        letter-spacing: 0.32em; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap;
        opacity: 0; transition: opacity 700ms ease 200ms, color 400ms ease;
      }
      #acm-loader .count span { display: inline-block; min-width: 3.2ch; margin-left: 0.9em; letter-spacing: 0.12em; text-align: left; color: #a3a3a3; }
      #acm-loader.ready .count { opacity: 1; }
      #acm-loader.done .count span { color: #d4d4d4; }
      #acm-loader.leave { opacity: 0; pointer-events: none; }
      #acm-loader.leave .mark { opacity: 0; transform: scale(1.12); transition-duration: 800ms; }
      #acm-loader.leave .count { opacity: 0; transition-delay: 0ms; }
      #acm-loader.leave .spill { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
      @media (prefers-reduced-motion: reduce) {
        #acm-loader, #acm-loader .mark, #acm-loader .spill, #acm-loader .count { transition: opacity 250ms ease; }
        #acm-loader.leave .mark, #acm-loader .mark { transform: none; }
      }
    </style>
    <noscript><style>#acm-loader { display: none !important; }</style></noscript>
  </head>
  <body>
    <div id="acm-loader" role="status" aria-label="Loading">
      <div class="spill" aria-hidden="true"></div>
      <div class="stage">
        <img class="mark" src="/acm-logo.png" alt="" width="311" height="311" />
        <div class="count" aria-hidden="true">Loading<span id="acm-loader-pct">0%</span></div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('acm-loader')
        if (!el) return
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var pctEl = document.getElementById('acm-loader-pct')
        // A returning visitor in the same session gets a quicker intro.
        var seen = false
        try { seen = sessionStorage.getItem('acm-intro-seen') === '1'; sessionStorage.setItem('acm-intro-seen', '1') } catch (e) {}
        var MIN = seen ? 450 : 1500
        var t0 = performance.now()
        var last = t0
        var target = 8, shown = 0, dataIn = false, finishing = false, gone = false
        // Hand over only once the page itself has finished loading (images,
        // fonts) — on phones that's the difference between smooth and janky.
        var pageLoaded = document.readyState === 'complete'
        window.addEventListener('load', function () { pageLoaded = true })

        function frame(now) {
          if (gone) return
          var t = now - t0
          var dt = Math.min(100, now - last)
          last = now
          // Until the data is in, creep toward 88% so progress never looks stuck.
          if (!dataIn || !pageLoaded) target = Math.max(target, (dataIn ? 94 : 88) * (1 - Math.exp(-t / 2600)))
          else if (t >= MIN) target = 100
          // Time-based easing, so it moves at the same pace on any frame rate.
          shown += (target - shown) * (reduce ? 1 : 1 - Math.exp(-dt / 180))
          if (target - shown < 0.3) shown = target
          pctEl.textContent = Math.round(shown) + '%'
          el.style.setProperty('--p', (shown / 100).toFixed(3))
          if (shown >= 100 && !finishing) finish()
          requestAnimationFrame(frame)
        }
        function finish() {
          finishing = true
          el.classList.add('done')
          setTimeout(function () {
            el.classList.add('leave')
            window.__acmIntroDone = true
            window.dispatchEvent(new Event('acm:intro-done'))
            setTimeout(function () { gone = true; el.remove() }, reduce ? 500 : 1100)
          }, reduce ? 50 : 320)
        }
        window.__acmStep = function () { target = Math.max(target, 30) }
        window.__acmLoaded = function () { dataIn = true }
        // Never hold the site hostage: whatever happens, reveal it.
        setTimeout(function () { dataIn = true; pageLoaded = true; target = 100 }, 7000)
        var logo = el.querySelector('.mark')
        var shownOnce = false
        function reveal() { if (shownOnce) return; shownOnce = true; el.classList.add('ready') }
        if (logo.complete) reveal(); else { logo.addEventListener('load', reveal); logo.addEventListener('error', reveal) }
        setTimeout(reveal, 600) // don't wait on a slow image forever
        requestAnimationFrame(frame)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
